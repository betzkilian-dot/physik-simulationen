<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Franck-Hertz-Versuch mit Quecksilber</title>
<style>
/* Gemeinsamer Stil aller Simulationen – dezent, einheitlich, iPad-tauglich. */
:root {
  --plus: #c62828;
  --minus: #1e5aa8;
  --strahl: #29b6f6;
  --vektor-v: #2e7d32;
  --vektor-f: #ef6c00;
  --feld: #7e6f9a;
  --geraet: #d9d9d6;
  --geraet-dunkel: #b8b8b4;
  --halter: #2a4f9e;
  --hintergrund: #c9cdd1;   /* 3D-Raum: ruhiges Mittelgrau statt Weiß */
  --seite: #dfe1e4;
  --dunkel: #16181c;
  --text: #22252a;
  --text-leise: #50565e;
  --flaeche: #f3f4f5;
  --linie: #c4c8cc;
  --akzent: #3a5f8f;
  --ziel: 44px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color: var(--text);
  background: var(--seite);
  -webkit-text-size-adjust: 100%;
  display: flex; flex-direction: column;
}
body.dunkel { background: var(--dunkel); }
body.dunkel #kopf, body.dunkel #kopf p { color: #e6e8eb; }

#kopf { padding: 8px 16px 4px; }
#kopf h1 { font-size: 1.25rem; margin: 0; }
#kopf p { margin: 2px 0 4px; color: var(--text-leise); font-size: 0.95rem; }

main { flex: 1; min-height: 0; display: grid; gap: 8px; padding: 0 8px 8px; }
#szene {
  position: relative; min-height: 0; border-radius: 10px; overflow: hidden;
  background: var(--hintergrund); border: 1px solid var(--linie);
}
#szene canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#szene .hinweis-webgl { padding: 24px; }
#szene .blick-knoepfe {
  position: absolute; left: 8px; top: 8px; right: 140px; display: flex; flex-wrap: wrap; gap: 6px;
  pointer-events: none;
}
/* Anzeige-Optionen als aufklappbares Menü oben rechts in der 3D-Ansicht */
#szene details.anzeige-menue {
  position: absolute; top: 8px; right: 8px; z-index: 2; margin: 0;
  width: max-content; max-width: min(320px, calc(100% - 16px)); max-height: calc(100% - 16px); overflow-y: auto;
  background: rgba(243, 244, 245, 0.96); box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
}
#szene .blick-knoepfe button { pointer-events: auto; background: rgba(247,247,246,.92);
}
#szene .lupe {
  position: absolute; right: 8px; bottom: 8px; border: 2px solid var(--akzent);
  border-radius: 6px; pointer-events: none; box-shadow: 0 1px 4px rgba(0,0,0,.25);
}
#steuerung { grid-area: steuerung; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#szene { grid-area: szene; }
#auswertung { grid-area: auswertung; min-height: 0; }
#auswertung details.bereich { margin-bottom: 0; }

/* Auswertung: Tabelle und Diagramm nebeneinander, Tabelle scrollt in sich */
.messreihe {
  display: grid; gap: 4px 14px; align-items: start;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
  grid-template-rows: auto 1fr;
  grid-template-areas: "tabelle diagramm" "steuerung diagramm";
}
.messreihe > div:first-child { grid-area: tabelle; }
.diagramm-steuerung { grid-area: steuerung; }
.diagramm-box { grid-area: diagramm; position: relative; }
/* Diagramm wird in seiner echten Größe gezeichnet (Schrift bleibt lesbar) */
#diagramm { height: clamp(210px, 31vh, 320px); overflow: hidden; }
#diagramm svg { display: block; width: 100%; height: 100%; }
.diagramm-schliessen { display: none; }
.diagramm-box.gross {
  position: fixed; inset: 4vh 4vw; z-index: 50; background: var(--flaeche);
  border-radius: 12px; padding: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
}
.diagramm-box.gross { display: flex; flex-direction: column; gap: 8px; }
.diagramm-box.gross .diagramm-schliessen { display: block; align-self: flex-end; }
.diagramm-box.gross #diagramm { flex: 1; height: auto; min-height: 0; }
.messreihe .tabelle-rahmen { max-height: 150px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.messreihe .tabelle-rahmen thead th { position: sticky; top: 0; background: var(--flaeche); }

/* Querformat: 3D oben links, Auswertung darunter, Bedienung rechts über die volle Höhe */
@media (orientation: landscape) {
  main {
    grid-template-columns: minmax(0, 1fr) 330px;
    grid-template-rows: minmax(0, 1fr) auto;
    grid-template-areas: "szene steuerung" "auswertung steuerung";
  }
  #auswertung .zeile { margin: 2px 0; }
  #regression-a { font-size: 0.9rem; }
}
/* Hochformat: 3D oben, darunter links Bedienung, rechts Auswertung */
@media (orientation: portrait) {
  body { height: auto; min-height: 100%; }
  main {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas: "szene szene" "steuerung auswertung";
  }
  #szene { height: 40vh; height: 40dvh; }
  #steuerung { overflow: visible; }
  .messreihe { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "tabelle" "steuerung" "diagramm"; }
  #diagramm { height: clamp(220px, 22vh, 300px); }
}

/* Bereiche */
details.bereich {
  background: var(--flaeche); border: 1px solid var(--linie); border-radius: 10px;
  margin-bottom: 8px;
}
details.bereich > summary {
  min-height: var(--ziel); display: flex; align-items: center; padding: 0 12px;
  font-weight: 600; cursor: pointer; list-style: none;
}
details.bereich > summary::-webkit-details-marker { display: none; }
details.bereich > summary::before { content: "▸"; margin-right: 8px; color: var(--text-leise); }
details.bereich[open] > summary::before { content: "▾"; }
details.bereich > .inhalt { padding: 4px 12px 12px; }
.teil-titel { font-weight: 600; margin: 12px 0 4px; }

/* Bedienelemente */
button, select, .schalter, .option {
  min-height: var(--ziel); font: inherit;
}
/* iPad: schnelles Mehrfachtippen (z. B. +0,1) darf die Seite nicht zoomen */
button, select, input, label, summary { touch-action: manipulation; }
button {
  min-width: var(--ziel); padding: 0 12px; border-radius: 8px;
  border: 1px solid var(--linie); background: #f7f7f6; color: var(--text); cursor: pointer;
}
button:active { background: #e8e9ea; }
button.haupt { background: var(--akzent); color: #fff; border-color: var(--akzent); }
select { padding: 0 8px; border-radius: 8px; border: 1px solid var(--linie); background: #fff; }
.zeile { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }

.regler { margin: 4px 0 8px; }
.schalter-zeile { column-gap: 14px; }
.regler .kopf { display: flex; justify-content: space-between; align-items: baseline; }
.regler .wert { font-variant-numeric: tabular-nums; font-weight: 600; }
.regler input[type=range] { width: 100%; height: var(--ziel); margin: 0; accent-color: var(--akzent); }
.regler .knoepfe { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

.schalter, .option { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.schalter input, .option input { width: 24px; height: 24px; margin: 0; accent-color: var(--akzent); }

/* Auswertung */
table.messtabelle { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 0.95rem; }
table.messtabelle th, table.messtabelle td { border-bottom: 1px solid var(--linie); padding: 4px 6px; text-align: right; }
table.messtabelle th { font-weight: 600; color: var(--text-leise); }
#regression-a { font-variant-numeric: tabular-nums; margin: 4px 0; }
#rechnung p { margin: 6px 0; }
#kopieren-feld textarea { width: 100%; height: 120px; font: 13px/1.3 ui-monospace, Menlo, Consolas, monospace; }

/* Meldung */
#meldung {
  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
  max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px;
  background: #33373d; color: #fff; opacity: 0; pointer-events: none; transition: opacity .2s;
}
#meldung.sichtbar { opacity: 1; }
[hidden] { display: none !important; }

/* Vektor: Pfeil über dem Formelzeichen */
.vektor { position: relative; display: inline-block; font-style: italic; padding-top: 0.35em; line-height: 1; }
.vektor::before {
  content: ""; position: absolute; left: 0.05em; right: -0.05em; top: 0.12em;
  border-top: 1.5px solid currentColor;
}
.vektor::after {
  content: ""; position: absolute; right: -0.1em; top: calc(0.12em - 3px);
  border: 3.5px solid transparent; border-left: 6px solid currentColor; border-right: 0;
}
/* Prüfungsfassung: Kennzeichen im Kopf und fester Hinweis statt Schalter */
body.pruefung #kopf h1::after {
  content: "Prüfungsfassung"; margin-left: 12px; padding: 2px 10px; border-radius: 4px;
  font-size: 13px; font-weight: 600; vertical-align: middle; letter-spacing: .03em;
  background: var(--text); color: #fff;
}
.hinweis-fest { color: var(--text-leise); font-size: 14px; padding: 4px 0; }

</style>
</head>

<main><div id="szene"></div><aside id="steuerung"></aside><section id="auswertung"></section></main>
<div id="meldung" role="status" aria-live="polite"></div>
