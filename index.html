<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef1f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Physik-Sims">
<title>Physik-Simulationen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* Sammlung – Seite im iPad-Glas-Stil (Spec 2026-11-25-sammlung-glas-design). Hell/Dunkel nur über prefers-color-scheme. */
:root {
  color-scheme: light dark;
  /* hell */
  --bg: #eef1f8; --txt: #111111; --mut: #5f6675; --mutsvg: #55607a; --akz: #007aff; --akzt: #ffffff;
  --glas: rgba(255, 255, 255, .55); --glas2: rgba(255, 255, 255, .6); --rand: rgba(255, 255, 255, .85);
  --schatten: 0 8px 32px rgba(31, 38, 135, .12); --glanz: rgba(255, 255, 255, .35);
  --deckend: #f8f9fd; --deckend2: #ffffff; --schleier: rgba(0, 0, 0, .18); --segment-an: #ffffff;
  --tapete:
    radial-gradient(circle at 15% 20%, #ffd6e7 0, transparent 40%),
    radial-gradient(circle at 85% 10%, #c7dcff 0, transparent 45%),
    radial-gradient(circle at 70% 85%, #d4f5e9 0, transparent 45%),
    radial-gradient(circle at 30% 90%, #e7dcff 0, transparent 40%);
  --tch: rgba(175, 82, 222, .12); --tchl: rgba(175, 82, 222, .38); --tcht: #7b2fa6;
  --neu: #15803d; --neubg: #dcfce7; --akt: #b45309; --aktbg: #fef3c7; --fehler: #b42318; --fehlerbg: #fde8e7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0d14; --txt: #f5f5f7; --mut: #a1a1aa; --mutsvg: #b4bccd; --akz: #0a84ff; --akzt: #ffffff;
    --glas: rgba(30, 30, 40, .45); --glas2: rgba(255, 255, 255, .10); --rand: rgba(255, 255, 255, .14);
    --schatten: 0 8px 32px rgba(0, 0, 0, .45); --glanz: rgba(255, 255, 255, .12);
    --deckend: #1a1c28; --deckend2: #262938; --schleier: rgba(0, 0, 0, .4); --segment-an: #5b6078;
    --tapete:
      radial-gradient(circle at 15% 20%, #5b2a86 0, transparent 42%),
      radial-gradient(circle at 85% 15%, #0f4c81 0, transparent 45%),
      radial-gradient(circle at 70% 90%, #0b5d4b 0, transparent 45%),
      radial-gradient(circle at 30% 85%, #3a1f5d 0, transparent 40%);
    --tch: rgba(191, 90, 242, .16); --tchl: rgba(191, 90, 242, .42); --tcht: #dcb4ff;
    --neu: #86efac; --neubg: #14361f; --akt: #fcd34d; --aktbg: #3a2c0b; --fehler: #ffb4ab; --fehlerbg: #3b1714;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background-color: var(--bg); color: var(--txt);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased;
}
button, a, input { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--akz); outline-offset: 2px; }

/* Feststehender Farbverlauf hinter allem (eigenes Element: background-attachment: fixed kann Safari auf dem iPad nicht) */
.tapete { position: fixed; inset: 0; z-index: -1; background: var(--tapete); pointer-events: none; }

/* ---------- Glas ---------- */
.glas {
  background: var(--glas); border: 1px solid var(--rand);
  -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  box-shadow: var(--schatten), inset 0 1px 0 var(--glanz);
}
.glas2 {
  background: var(--glas2); border: 1px solid var(--rand);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
}
/* Ohne Unschärfe (ältere Geräte, „Transparenz reduzieren“ greift ohnehin) wären die Flächen zu durchsichtig: deckend. */
@supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .glas { background: var(--deckend); }
  .glas2 { background: var(--deckend2); }
}
@media (prefers-reduced-transparency: reduce) {
  .glas { background: var(--deckend); }
  .glas2 { background: var(--deckend2); }
}

.app {
  display: flex; gap: 14px; min-height: 100vh;
  padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 14px max(14px, env(safe-area-inset-left));
}

/* ---------- Seitenleiste ---------- */
.seitenleiste {
  width: 230px; flex: none; align-self: flex-start; position: sticky; top: 14px;
  height: calc(100vh - 28px); overflow-y: auto; border-radius: 24px; padding: 18px 12px;
  display: flex; flex-direction: column;
}
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px; padding: 0 8px 14px; letter-spacing: -.01em; }
.logo-zeichen {
  width: 32px; height: 32px; flex: none; border-radius: 9px; background: linear-gradient(135deg, #5ac8fa, #007aff);
  display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px;
}
.suche { display: flex; align-items: center; gap: 6px; border-radius: 12px; padding: 0 10px; min-height: 46px; margin-bottom: 4px; }
.lupe { font-size: 13px; opacity: .7; flex: none; }
#suche {
  flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; outline: none; font-size: 16px;
  -webkit-appearance: none; appearance: none;
}
#suche::placeholder { color: var(--mut); }
.suche:focus-within { outline: 3px solid var(--akz); outline-offset: 1px; }
.gruppe h2 { font-size: 12px; font-weight: 600; color: var(--mut); margin: 0; padding: 14px 10px 6px; }
.gruppe .wahl { display: flex; flex-direction: column; gap: 2px; }
.gruppe-lehrkraft { margin-top: auto; }
.eintrag {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 8px 10px;
  border: 0; border-radius: 12px; background: transparent; text-align: left; text-decoration: none; cursor: pointer; font-size: 15px;
}
.eintrag .sym { width: 22px; flex: none; text-align: center; color: var(--akz); }
.eintrag:hover { background: var(--glas2); }
.eintrag[aria-pressed="true"] { background: var(--akz); color: var(--akzt); font-weight: 600; }
.eintrag[aria-pressed="true"] .sym { color: var(--akzt); }

/* ---------- Hauptbereich ---------- */
main { flex: 1; min-width: 0; padding: 8px 6px; display: flex; flex-direction: column; gap: 16px; }
.seitentitel { margin: 4px 4px 2px; font-size: 32px; font-weight: 700; letter-spacing: -.02em; }
#karten { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }

.karte { border-radius: 24px; min-width: 0; transition: transform .14s ease-out, box-shadow .14s ease-out; }
/* Kurzes Antippen: Karte gibt leicht nach (nur ohne „Bewegung reduzieren“) */
@media (prefers-reduced-motion: no-preference) {
  .karte:active { transform: scale(.98); box-shadow: 0 4px 16px rgba(0, 0, 0, .12), inset 0 1px 0 var(--glanz); }
}
.karte-flaeche {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 44px; padding: 12px; margin: 0;
  border: 0; border-radius: inherit; background: transparent; text-align: left; text-decoration: none; cursor: pointer;
}
.karte .kachel { display: block; width: 150px; flex: none; border-radius: 16px; overflow: hidden; background: var(--glas2); }
/* Kachel-Verlauf durchsichtig: das Glas darunter ist der Grund (sonst Nähte, s. ERKENNTNISSE) */
.kachel svg, .mini svg { display: block; width: 100%; height: auto; --mut: var(--mutsvg); --art1: transparent; --art2: transparent; }
.info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--mut); font-weight: 500; margin: 0; }
.tt { display: block; font-size: 17px; font-weight: 600; margin: 2px 0 10px; letter-spacing: -.01em; overflow-wrap: anywhere; }
.karte-hinweis {
  align-self: flex-start; display: inline-flex; align-items: center; min-height: 32px; padding: 0 14px; border-radius: 999px;
  background: var(--glas2); border: 1px solid var(--rand); color: var(--akz); font-weight: 600; font-size: 14px;
}
.pfeil { flex: none; align-self: center; margin-left: auto; padding: 0 4px 0 2px; font-size: 30px; line-height: 1; font-weight: 300; color: var(--mut); opacity: .7; }
.marke { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; letter-spacing: .02em; }
.marke-neu { color: var(--neu); background: var(--neubg); }
.marke-aktualisiert { color: var(--akt); background: var(--aktbg); }

.knopf {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 9px 16px;
  border: 1px solid var(--rand); border-radius: 12px; background: var(--glas2); text-decoration: none; cursor: pointer;
  font-size: 15px; line-height: 1.2;
}
.knopf.primaer { background: var(--akz); color: var(--akzt); border-color: transparent; font-weight: 600; }
.knopf[aria-busy="true"] { opacity: .6; cursor: progress; }

#leer-hinweis { border-radius: 24px; padding: 28px 20px; text-align: center; }
#leer-hinweis p { margin: 0 0 12px; font-size: 17px; font-weight: 600; }
.fuss { color: var(--mut); font-size: 13px; padding: 4px 4px 12px; }

/* ---------- Glasblatt ---------- */
#schleier { position: fixed; inset: 0; z-index: 20; background: var(--schleier); }
#blatt {
  position: fixed; z-index: 21; left: 50%; bottom: 14px; transform: translateX(-50%);
  width: min(680px, calc(100vw - 28px)); max-height: calc(100vh - 28px); max-height: calc(100dvh - 28px);
  overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  border-radius: 30px; padding: 10px 22px 22px; outline: none;
  animation: blatt-hoch .22s ease-out;
}
@keyframes blatt-hoch { from { opacity: 0; translate: 0 24px; } }
@media (prefers-reduced-motion: reduce) { #blatt { animation: none; } }
.griff { width: 40px; height: 5px; border-radius: 3px; background: var(--mut); opacity: .5; margin: 0 auto 14px; }
.blatt-kopf { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.mini { width: 84px; flex: none; border-radius: 12px; overflow: hidden; background: var(--glas2); }
.blatt-titelblock { flex: 1; min-width: 0; }
#blatt .kurztext { margin: -4px 0 14px; color: var(--mut); font-size: 14px; }
#blatt-titel { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
.zu {
  flex: none; align-self: flex-start; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 15px; color: var(--mut); cursor: pointer; padding: 0;
}
.segment { display: inline-flex; border-radius: 12px; padding: 3px; margin: 0 0 14px; }
.segment-knopf {
  min-width: 72px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 9px; background: transparent;
  font-size: 15px; cursor: pointer;
}
.segment-knopf[aria-pressed="true"] { background: var(--segment-an); box-shadow: 0 1px 4px rgba(0, 0, 0, .15); font-weight: 600; }

.aktionen, .lehrer-knoepfe { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
.aktion {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 88px; padding: 8px;
  border-radius: 20px; text-align: center; text-decoration: none; cursor: pointer; font-size: 13px; font-weight: 500; line-height: 1.2;
}
.aktion { min-width: 0; }
.aktion .txt { max-width: 100%; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
.aktion .sym { font-size: 24px; line-height: 1; color: var(--akz); }
.aktion .sym svg { display: block; width: 24px; height: 24px; }
.aktion.haupt { background: var(--akz); color: var(--akzt); border: 1px solid transparent; }
.aktion.haupt .sym { color: var(--akzt); }
.aktion:active { filter: brightness(.95); }
.aktion[aria-busy="true"] { opacity: .6; cursor: progress; }

/* Lehrerreihe: abgesetzt, violetter Ton */
.lehrerspalte { margin-top: 16px; padding: 12px; border-radius: 22px; background: var(--tch); border: 1px solid var(--tchl); }
.lehrerspalte h3 { margin: 0 0 8px 6px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--tcht); }
.lehrer-knoepfe { gap: 8px; }
.aktion.lehrer { position: relative; min-height: 64px; font-size: 12.5px; padding: 8px 6px; background: var(--glas2); border: 1px solid var(--tchl); color: var(--tcht); }
.aktion.lehrer .sym { font-size: 20px; color: var(--tcht); }
.aktion.lehrer.bereit { border: 2px solid var(--tcht); font-weight: 600; }
.lehrer-marke { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--akt); }
.lehrer-marke.neu { background: var(--neu); }
.karten-meldung { margin: 10px 0 0; padding: 8px 10px; border-radius: 10px; background: var(--fehlerbg); color: var(--fehler); font-size: 14px; }
.karten-meldung.info { background: var(--deckend2); color: var(--txt); }

/* ---------- Anmeldung ---------- */
#anmelde-dialog {
  border-radius: 22px; color: var(--txt); padding: 22px; width: min(420px, calc(100vw - 32px));
}
@supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) { #anmelde-dialog { background: var(--deckend); } }
#anmelde-dialog::backdrop { background: rgba(5, 8, 15, .4); }
#anmelde-dialog h2 { margin: 0 0 12px; font-size: 19px; }
#anmelde-dialog label { display: block; margin-bottom: 12px; }
#passwort {
  display: block; width: 100%; margin-top: 4px; min-height: 44px; padding: 8px 12px; border-radius: 12px;
  border: 1px solid var(--rand); background: var(--deckend2); color: var(--txt); font-size: 16px;
}
.haken { display: flex !important; align-items: center; gap: 10px; min-height: 44px; }
.haken input { width: 22px; height: 22px; margin: 0; accent-color: var(--akz); }
#anmelde-meldung { min-height: 1.4em; margin: 0 0 12px; color: var(--fehler); }
#anmelde-meldung.info { color: var(--mut); }
#anmelde-meldung code { font-size: 14px; }
.dialog-knoepfe { display: flex; justify-content: flex-end; gap: 8px; }

/* ---------- QR-Ebene (schwarz auf weiß, über allem) ---------- */
#qr-ebene {
  position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow: auto;
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; cursor: pointer;
}
.qr-code {
  width: min(80vw, 80vh); height: min(80vw, 80vh); background: #fff; color: #000; padding: 6%;
  border-radius: 8px; flex: none;
}
.qr-code svg { display: block; width: 100%; height: 100%; }
#qr-titel { margin: 12px 0 2px; font-size: 22px; font-weight: 700; text-align: center; }
.qr-adresse { margin: 0; color: var(--mut); text-align: center; word-break: break-all; }
.qr-hinweis { margin: 6px 0 0; color: var(--mut); font-size: 13px; }

/* ---------- Schmal: Glasleiste oben, Blatt volle Breite ---------- */
@media (max-width: 900px) {
  .app { flex-direction: column; gap: 12px; padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 12px max(12px, env(safe-area-inset-left)); }
  .seitenleiste {
    position: sticky; top: 8px; z-index: 5; width: auto; height: auto; overflow: visible; align-self: stretch;
    border-radius: 22px; padding: 8px 10px;
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "logo suche lehrkraft" "kurse kurse kurse";
    gap: 6px 10px; align-items: center;
  }
  .logo { grid-area: logo; padding: 0 2px; font-size: 17px; }
  .suche { grid-area: suche; margin: 0; }
  .gruppe-kurse { grid-area: kurse; min-width: 0; }
  .gruppe-lehrkraft { grid-area: lehrkraft; margin: 0; }
  .gruppe h2, .gruppe-werkzeuge { display: none; }
  .gruppe-kurse .wahl {
    flex-direction: row; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 2px;
  }
  .gruppe-kurse .wahl::-webkit-scrollbar { display: none; }
  .gruppe-kurse .eintrag {
    width: auto; flex: none; white-space: nowrap; border-radius: 999px; padding: 8px 14px;
    background: var(--glas2); border: 1px solid var(--rand);
  }
  .gruppe-kurse .eintrag[aria-pressed="true"] { background: var(--akz); border-color: transparent; }
  .gruppe-kurse .sym { display: none; }
  .gruppe-lehrkraft .eintrag { width: auto; padding: 8px 12px; }
  main { padding: 4px 2px; }
  .seitentitel { font-size: 28px; }
  #blatt {
    left: 0; right: 0; bottom: 0; transform: none; width: auto; max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px);
    border-radius: 28px 28px 0 0; border-bottom: 0;
    padding: 10px max(18px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  }
}
@media (max-width: 700px) {
  #karten { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 600px) {
  .nur-breit, .logo-text { display: none; }
  .logo { gap: 0; }
  .gruppe-lehrkraft .eintrag { min-width: 44px; justify-content: center; padding: 8px 10px; gap: 4px; }
  .gruppe-lehrkraft .sym { width: auto; }
  .karte .kachel { width: 120px; }
  .mini { width: 64px; }
  #blatt-titel { font-size: 19px; }
}

</style>
</head>
<body>
<div class="tapete" aria-hidden="true"></div>
<div class="app">
<nav id="filter" class="seitenleiste glas" aria-label="Kurse und Suche">
<div class="logo"><span class="logo-zeichen" aria-hidden="true">⚛</span><span class="logo-text">Physik</span></div>
<label class="suche glas2"><span class="lupe" aria-hidden="true">🔍</span><input type="search" id="suche" placeholder="Suchen" aria-label="Titel oder Thema suchen" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></label>
<div class="gruppe gruppe-kurse" role="group" aria-labelledby="kurse-titel">
<h2 id="kurse-titel">Kurse</h2>
<div class="wahl">
<button type="button" class="eintrag" data-kurs="alle" aria-pressed="true"><span class="sym" aria-hidden="true">◎</span><span>Alle</span></button>
<button type="button" class="eintrag" data-kurs="Ph 12 eA" data-jahrgang="Ph 12" data-stufe="eA" aria-pressed="false"><span class="sym" aria-hidden="true">⑫</span><span>Ph 12 eA</span></button>
<button type="button" class="eintrag" data-kurs="Ph 12 gA" data-jahrgang="Ph 12" data-stufe="gA" aria-pressed="false"><span class="sym" aria-hidden="true">⑫</span><span>Ph 12 gA</span></button>
<button type="button" class="eintrag" data-kurs="Ph 13 eA" data-jahrgang="Ph 13" data-stufe="eA" aria-pressed="false"><span class="sym" aria-hidden="true">⑬</span><span>Ph 13 eA</span></button>
<button type="button" class="eintrag" data-kurs="Ph 13 gA" data-jahrgang="Ph 13" data-stufe="gA" aria-pressed="false"><span class="sym" aria-hidden="true">⑬</span><span>Ph 13 gA</span></button>
</div>
</div>
<div class="gruppe gruppe-werkzeuge">
<h2>Werkzeuge</h2>
<div class="wahl">
<a class="eintrag" href="https://betzkilian-dot.github.io/stroboskop/" target="_blank" rel="noopener"><span class="sym" aria-hidden="true">◐</span><span>Stroboskop-App ↗</span></a>
</div>
</div>
<div class="gruppe gruppe-lehrkraft">
<h2>Lehrkraft</h2>
<div class="wahl">
<button type="button" class="eintrag" id="anmelden" aria-label="Anmelden (Lehrkraft)" title="Anmelden (Lehrkraft)"><span class="sym" aria-hidden="true">🔒</span><span class="nur-breit">Anmelden</span></button>
<button type="button" class="eintrag an" id="abmelden" aria-label="Angemeldet – Abmelden" title="Angemeldet – Abmelden" hidden><span class="sym" aria-hidden="true">✓</span><span>Abmelden</span></button>
</div>
</div>
</nav>
<main>
<h1 class="seitentitel">Simulationen</h1>
<div id="karten">
<article class="karte glas" data-id="elektronenablenkroehre">
<button type="button" class="karte-flaeche" data-oeffnen="elektronenablenkroehre" aria-haspopup="dialog" aria-labelledby="titel-elektronenablenkroehre" aria-describedby="meta-elektronenablenkroehre">
<span class="kachel" aria-hidden="true"><svg id="kachel-elektronenablenkroehre" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130" role="img" aria-label="Elektronenablenkröhre">
